receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlphttp/website:
    traces_endpoint: "${env:XSIAM_INGEST_URL}"
    encoding: json
    headers:
      Authorization: "${env:XSIAM_INGEST_API}"
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlphttp/website]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
